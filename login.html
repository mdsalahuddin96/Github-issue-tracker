<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- font awesome integrate -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- tailwind and daisyUi connection -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- font integration -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <!-- title and logo -->
    <title>Github Issue Tracker | Login</title>
    

    <!-- style sheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen max-w-md mx-auto bg-gray-300 p-8">
    <div class="logo mx-auto flex flex-col justify-center items-center">
        <div class="mb-6"><img src="./assets/github-logo.png"></div>
        <h1 class="text-2xl font-semibold">GitHub Issues Tracker</h1>
        <p class="text-[#64748B]">Sign in to manage your issues</p>
    </div>
    <div class="form mt-6">
        <fieldset class="fieldset bg-base-100 border-base-300 rounded-box border w-full p-4 mx-auto">
            <label class="label text-[#1F2937] text-[16px] font-medium">Username</label>
            <input id="username-input" type="text" class="input bg-base-200 rounded-lg w-full" placeholder="Enter username" />
            <p class="text-[#4A00FF]">Default: admin</p>
            <label class="label text-[#1F2937] text-[16px] font-medium">Password</label>
            <input id="password-input" type="password" class="input bg-base-200 w-full rounded-lg" placeholder="Enter password" />
            <p class="text-[#4A00FF]">Default: admin123</p>
            <button id="sign-in-btn" class="btn btn-neutral mt-4 bg-[#4A00FF] rounded-lg border-none">Sign In</button>
            <div class="text-center mt-6 space-y-6">
                <p class="text-[#1F2937] text-[16px]">OR</p>
                <p class="text-[#64748B] text-sm">Demo Credentials:</p>
                <div>
                    <p class="text-[16px]"><span class="font-semibold text-[#1F2937]">Username:</span> admin</p>
                    <p class="text-[16px]"><span class="font-semibold text-[#1F2937]">Password:</span> admin123</p>
                </div>
            </div>
            
        </fieldset>        
    </div>
    <script src="login.js"></script>
</body>
</html>
