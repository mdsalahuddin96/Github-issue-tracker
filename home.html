<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- font awesome integrate -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- tailwind and daisyUi connection -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- font integration -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <!-- title and logo -->
    <title>Github Issue Tracker | Home</title>
    

    <!-- style sheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#F8FAFC]">
    <header>
        <div class="navbar bg-base-100 shadow-sm flex justify-between items-center">
            <div class="flex items-center gap-1">
                <div class="w-9"><img src="./assets/github-logo.png" alt="github logo"> </div>
                <h1 class="text-lg md:text-[24px] font-semibold text-[#1F2937]">Github Issue Tracker</h1>
            </div>
            <div class="flex gap-2">
                <label class="input">
                    <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <g
                        stroke-linejoin="round"
                        stroke-linecap="round"
                        stroke-width="2.5"
                        fill="none"
                        stroke="currentColor"
                        >
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.3-4.3"></path>
                        </g>
                    </svg>
                    <input type="search" required placeholder="Search issues..." />
                </label>
                <button class="btn btn-primary">+ New Issue</button>
            </div>
        </div>        
    </header>
    <main class="py-16 space-y-4">
        <!-- tab section -->
        <section class="tab-section bg-base-100 shadow-sm max-w-[1110px] mx-auto">
            <div id="lesson-container" class="flex items-center gap-3 p-6 flex-wrap">
                <button id="all-btn" onclick="loadAllIssues('all-btn')" class="category-btn btn active">All</button>
                <button id="open-btn" onclick="loadOpenIssue('open-btn')" class="category-btn btn ">Open</button>
                <button id="closed-btn" onclick="loadClosedIssue('closed-btn')" class="category-btn btn ">Closed</button>
            </div>
        </section>
        <!-- all issue section -->
         <section class="tab-section bg-base-100 shadow-sm max-w-[1110px] mx-auto">
            <!--All issue header section -->
            <div class="flex justify-between items-center shadow-sm p-6">
                <div class="flex gap-2 items-center">
                    <div class="w-12 p-2 rounded-full bg-base-300"><img src="./assets/Aperture.png"></div>
                    <div>
                        <h1 class="text-xl font-semibold"><span id="total-issue">50</span> Issues</h1>
                        <p class="text-[#64748B] text-[16px]">Track and manage your project issues</p>
                    </div>
                </div>
                <div class="flex gap-4">
                    <div class="flex items-center gap-1">
                        <div class="w-3 h-3 p-1 rounded-full bg-green-700"></div><span class="text-[16px] font-medium">Open</span>
                    </div>
                    <div class="flex items-center gap-1">
                        <div class="w-3 h-3 p-1 rounded-full bg-purple-700"></div><span class="text-[16px] font-medium">Closed</span>
                    </div>
                </div>
            </div>
            <!-- All issue card section -->
            <div id="card-container" class="grid grid-cols-4 gap-3  p-6">
                <div class="card bg-base-100 card-lg shadow-sm border-2 border-red-600 p-4">
                    <div class="flex justify-between items-center">
                        <img src="./assets/Open-Status.png">
                        <img src="./assets/Closed- Status .png">
                        <p class="text-sm font-medium  px-4 py-[6px] rounded-full high">HIGH</p>
                    </div>
                    <div class="space-y-2 my-2">
                        <h2 class="font-semibold">Fix navigation menu on mobile devices</h2>
                        <p class="text-[#64748B] text-[12px] line-clamp-2">The navigation menu doesn't collapse properly on mobile devices...</p>
                        <span class="text-red-600 px-4 py-[6px] rounded-full">HIGH</span>
                        <span class="text-red-600 bg-[#FEECEC] px-4 py-[6px] rounded-full">HIGH</span>
                    </div>
                    <div class="mt-6">
                        <div class="flex justify-between items-center">
                            <p>Jon </p>
                            <p>Doe</p>
                        </div>
                        <div></div>
                    </div>
                </div>
            </div>
         </section>
    </main>
    <script src="./script.js"></script>
</body>
</html>
